<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edo-solver</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>edo-solver</h1><p>Ecuaciones diferenciales paso a paso · método del M.Sc. Ing. Eudal Avendaño Gonzales</p></header>
<main>
  <nav id="tabs">
    <button data-tab="ed" class="activa">Ecuación diferencial</button>
    <button data-tab="conceptos">Conceptos</button>
    <button data-tab="calculo">Derivadas e integrales</button>
  </nav>

  <section id="tab-conceptos" hidden>
    <label>Herramienta</label>
    <select id="c-herr">
      <option value="constantes">Constantes con condiciones iniciales</option>
      <option value="tipo">Tipo de solución (general, particular, singular, trivial)</option>
      <option value="dependencia">Dependencia lineal y Wronskiano</option>
      <option value="raices">ED desde las raíces de la ecuación característica</option>
    </select>
    <div class="c-campo" data-herr="constantes tipo"><label>Ecuación diferencial</label><input id="c-ed" type="text" placeholder="y'''+y'=0" autocomplete="off"></div>
    <div class="c-campo" data-herr="constantes tipo"><label>Solución (general o la que quieras analizar)</label><input id="c-resp" type="text" placeholder="y=C1+C2 cos x+C3 sen x" autocomplete="off"></div>
    <div class="c-campo" data-herr="constantes"><label>Condiciones iniciales</label><input id="c-cond" type="text" placeholder="y(pi)=0, y'(pi)=2, y''(pi)=-1" autocomplete="off"></div>
    <div class="c-campo" data-herr="tipo"><label>Solución general de la ED (opcional, para distinguir particular de singular)</label><input id="c-gen" type="text" placeholder="y=C x+C^2" autocomplete="off"></div>
    <div class="c-campo" data-herr="dependencia"><label>Funciones separadas por «;»</label><input id="c-funcs" type="text" placeholder="x; 2x; x^2" autocomplete="off"></div>
    <div class="c-campo" data-herr="dependencia"><label><input id="c-mismo" type="checkbox" style="width:auto"> Son soluciones de una misma ED lineal homogénea</label></div>
    <div class="c-campo" data-herr="raices"><label>Raíces (repetidas, «(2)», «doble» o D1=D2=…)</label><input id="c-raices" type="text" placeholder="D1=D2=5+2i; D3=D4=5-2i; D5=D6=0" autocomplete="off"></div>
    <div class="fila"><button id="btn-concepto" class="primario">Resolver</button></div>
    <div id="salida-conceptos"></div>
  </section>

  <section id="tab-ed">
    <label>Ecuación (texto o editor matemático)</label>
    <div class="fila">
      <input id="entrada" type="text" placeholder="y'+2y=x e^x   ·   (x+y)dx-(x-y)dy=0   ·   (D^2-3D+2)y=e^x" autocomplete="off">
      <button id="toggle-ml" type="button" title="Usar el editor matemático">∑</button>
    </div>
    <math-field id="ml" style="display:none"></math-field>
    <label>Condiciones iniciales (opcional)</label>
    <input id="condiciones" type="text" placeholder="y(1)=2, y'(0)=-1" autocomplete="off">
    <div id="lectura" class="caja"></div>
    <div class="fila">
      <select id="metodo" style="width:auto" title="Método de resolución"><option value="">Método: automático</option></select>
      <button id="btn-clasificar">Clasificar</button>
      <button id="btn-resolver" class="primario">Resolver</button>
    </div>
    <label>Revisar mi respuesta</label>
    <input id="respuesta" type="text" placeholder="y=3x-x^2   ·   x/y^2+1/y^3=C" autocomplete="off">
    <div class="fila"><button id="btn-verificar">Verificar</button></div>
    <div id="salida-ed"></div>
  </section>

  <section id="tab-calculo" hidden>
    <label>Función de x</label>
    <input id="f" type="text" placeholder="x^2 sen x   ·   x e^(2x)   ·   1/(x^2+1)" autocomplete="off">
    <div class="fila">
      <button id="btn-derivar">Derivar</button>
      <button id="btn-integrar" class="primario">Integrar</button>
    </div>
    <div id="salida-calculo"></div>
  </section>
</main>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="vendor/mathlive/mathlive.min.js"></script>
<script src="app.js"></script>
</body>
</html>
