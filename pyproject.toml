[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edo-solver"
version = "0.1.0"
description = "Resolutor de EDO paso a paso, en español, con el método del docente"
requires-python = ">=3.11"
dependencies = ["sympy>=1.13", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pyyaml>=6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
